<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' https://folderss-viewer; script-src 'self' https://folderss-viewer 'unsafe-inline'; style-src 'self' https://folderss-viewer 'unsafe-inline';">
<title>Text Viewer</title>
<link id="hljs-theme" rel="stylesheet" href="themes/hljs-dark.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }

  /* 테마를 받기 전(theme-pending)에는 --bg가 없어 투명 → C#이 지정한 WebView 기본 배경색(현재 테마 색)이 보인다. */
  body {
    background: var(--bg, transparent);
    color: var(--fg, #d4d4d4);
    font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.6;
  }

  #container {
    height: 100vh;
    overflow: auto;
    padding: 16px 20px;
  }

  pre {
    margin: 0;
    white-space: pre;
    word-break: normal;
    overflow-wrap: normal;
  }

  code {
    font-family: inherit;
    font-size: inherit;
    background: transparent !important;
    padding: 0 !important;
  }

  /* line numbers */
  .line-numbers-wrap {
    display: flex;
  }
  .line-numbers {
    user-select: none;
    text-align: right;
    padding-right: 16px;
    color: var(--line-num, #555);
    min-width: 3ch;
  }
  .code-wrap { flex: 1; overflow: auto; }

  /* plain text (no highlight) */
  .plain { white-space: pre-wrap; word-break: break-word; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--scroll, #444); border-radius: 4px; }
</style>
<!-- 테마 색: app.open/setTheme이 C#(ViewerTheme)이 보낸 색으로 채운다. -->
<style id="folderss-theme"></style>
</head>
<body class="theme-pending">
<div id="container">
  <div class="line-numbers-wrap">
    <div class="line-numbers" id="lineNums"></div>
    <div class="code-wrap">
      <pre><code id="code"></code></pre>
    </div>
  </div>
</div>
<script src="highlight.min.js"></script>
<script>
var _content = '';
var _language = 'plaintext';
var _readonly = true;

var HLJS_THEME_DARK  = 'themes/hljs-dark.css';
var HLJS_THEME_LIGHT = 'themes/hljs-light.css';

// C#(ViewerTheme)이 보낸 { light, colors }를 body.themed의 CSS 변수(--bg 등)로 넣고 코드 하이라이트 밝기를 고른다.
function applyTheme(theme) {
  var colors = (theme && theme.colors) || {};
  document.getElementById('folderss-theme').textContent = 'body.themed{'
    + Object.keys(colors).map(function(k) { return '--' + k + ':' + colors[k]; }).join(';') + '}';
  document.body.className = 'themed';
  document.getElementById('hljs-theme').href = theme && theme.light ? HLJS_THEME_LIGHT : HLJS_THEME_DARK;
}

function renderContent() {
  var codeEl = document.getElementById('code');
  var numsEl = document.getElementById('lineNums');

  if (_language === 'plaintext' || _language === 'txt') {
    codeEl.className = 'plain';
    codeEl.textContent = _content;
  } else {
    codeEl.className = _language;
    codeEl.textContent = _content;
    hljs.highlightElement(codeEl);
  }

  var lines = _content.split('\n');
  // remove trailing empty line artifact
  if (lines[lines.length - 1] === '') lines.pop();
  numsEl.textContent = lines.map(function(_, i) { return i + 1; }).join('\n');
}

var app = {
  open: function(content, language, theme, readonly) {
    _content  = content;
    _language = language || 'plaintext';
    _readonly = readonly !== false;
    applyTheme(theme);
    renderContent();
  },

  setTheme: function(theme) {
    applyTheme(theme);
  }
};
</script>
</body>
</html>
