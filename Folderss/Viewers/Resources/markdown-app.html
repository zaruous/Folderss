<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' https://folderss-viewer; script-src 'self' https://folderss-viewer; style-src 'self' https://folderss-viewer 'unsafe-inline'; font-src 'self' https://folderss-viewer data:; img-src 'self' https://folderss-viewer https://folderss-doc-asset data: http: https:;">
<title>Markdown Viewer</title>
<link rel="stylesheet" href="katex.min.css">
<style>
/* ── Reset ───────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }

/* ── Design tokens ───────────────────────── */
body {
  --bg:        #1e1e1e;
  --panel:     #252526;
  --border:    #3c3c3c;
  --fg:        #d4d4d4;
  --fg2:       #888;
  --accent:    #569cd6;
  --hover:     #2a2d2e;
  --sel:       #094771;
  --toolbar-h: 34px;
  --toc-w:     220px;
  --font-mono: 'Cascadia Code', 'Consolas', monospace;
  --font-sans: 'Segoe UI', system-ui, sans-serif;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--fg);
  background: var(--bg);
}

body.light {
  --bg: #ffffff; --panel: #f3f3f3; --border: #ddd; --fg: #24292f;
  --fg2: #777; --accent: #0550ae; --hover: #f0f0f0; --sel: #cce5ff;
}
body.nord {
  --bg: #2e3440; --panel: #3b4252; --border: #4c566a; --fg: #d8dee9;
  --fg2: #7b88a1; --accent: #88c0d0; --hover: #434c5e; --sel: #4c566a;
}
body.catppuccin {
  --bg: #1e1e2e; --panel: #181825; --border: #45475a; --fg: #cdd6f4;
  --fg2: #6c7086; --accent: #89b4fa; --hover: #313244; --sel: #45475a;
}
body.solarized {
  --bg: #002b36; --panel: #073642; --border: #586e75; --fg: #839496;
  --fg2: #586e75; --accent: #268bd2; --hover: #073642; --sel: #0d3640;
}
body.dracula {
  --bg: #282a36; --panel: #1e1f29; --border: #44475a; --fg: #f8f8f2;
  --fg2: #6272a4; --accent: #bd93f9; --hover: #44475a; --sel: #44475a;
}
body.github {
  --bg: #ffffff; --panel: #f6f8fa; --border: #d0d7de; --fg: #24292f;
  --fg2: #656d76; --accent: #0969da; --hover: #f3f4f6; --sel: #ddf4ff;
}
body.sakura {
  --bg: #fff8fa; --panel: #fdf2f6; --border: #ebc4d2; --fg: #3a1e2a;
  --fg2: #7d5566; --accent: #d63a78; --hover: #f9dde7; --sel: #f8cfde;
}
body.sunset {
  --bg: #221a16; --panel: #1a1411; --border: #4a372e; --fg: #f5e6dc;
  --fg2: #a08878; --accent: #ff8a3d; --hover: #352822; --sel: #6b3a1e;
}
body.tokyonight {
  --bg: #1a1b26; --panel: #16161e; --border: #292e42; --fg: #c0caf5;
  --fg2: #565f89; --accent: #7aa2f7; --hover: #24283b; --sel: #33467c;
}
body.onedark {
  --bg: #282c34; --panel: #21252b; --border: #3e4451; --fg: #abb2bf;
  --fg2: #5c6370; --accent: #61afef; --hover: #2c313a; --sel: #3e4451;
}
body.monokai {
  --bg: #272822; --panel: #1e1f1c; --border: #49483e; --fg: #f8f8f2;
  --fg2: #75715e; --accent: #a6e22e; --hover: #3e3d32; --sel: #49483e;
}
body.gruvbox {
  --bg: #282828; --panel: #1d2021; --border: #504945; --fg: #ebdbb2;
  --fg2: #928374; --accent: #fabd2f; --hover: #3c3836; --sel: #504945;
}

/* 테마를 받기 전(app.open 전)에는 배경을 비워 C#이 지정한 WebView 기본 배경색(현재 테마 색)이 보이게 하고, 툴바도 숨긴다.
   기본 테마 색으로 먼저 그렸다가 바뀌며 깜빡이는 것을 막는다. */
body.theme-pending { background: transparent; }
body.theme-pending #mdv-root { visibility: hidden; }

/* ── Layout ──────────────────────────────── */
#mdv-root {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* toolbar */
#mdv-toolbar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 8px;
  height: var(--toolbar-h);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.tb-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

button.tb {
  background: transparent;
  border: none;
  color: var(--fg2);
  padding: 3px 8px;
  border-radius: 3px;
  cursor: pointer;
  font-size: 12px;
  white-space: nowrap;
}
button.tb:hover { background: var(--hover); color: var(--fg); }
button.tb.active { background: var(--sel); color: var(--accent); }

/* export dropdown */
.tb-dropdown { position: relative; }
#exportMenu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
  z-index: 100;
  min-width: 140px;
}
#exportMenu.open { display: block; }
#exportMenu button {
  display: block; width: 100%;
  background: transparent; border: none;
  color: var(--fg); text-align: left;
  padding: 7px 12px; font-size: 12px; cursor: pointer;
}
#exportMenu button:hover { background: var(--hover); }

/* find bar */
#findBar {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#findBar.open { display: flex; }
#findInput {
  width: 220px;
  max-width: 40vw;
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 4px 6px;
  font: 12px var(--font-sans);
  outline: none;
}
#findInput:focus { border-color: var(--accent); }
#findCount {
  min-width: 48px;
  color: var(--fg2);
  font-size: 12px;
  text-align: center;
}
mark.md-find-hit {
  background: #d7a700;
  color: #1f1f1f;
  padding: 0 1px;
  border-radius: 2px;
}
mark.md-find-hit.active {
  background: #ff6a00;
  color: #fff;
}

/* main area */
#mdv-main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* toc */
#mdv-toc-panel {
  width: var(--toc-w);
  min-width: 80px;
  max-width: 400px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  padding: 8px 0;
  flex-shrink: 0;
  background: var(--panel);
}
#mdv-toc-panel.hidden { display: none; }

#mdv-toc-panel .toc-item {
  display: block;
  padding: 3px 12px;
  color: var(--fg2);
  text-decoration: none;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid transparent;
}
#mdv-toc-panel .toc-item:hover { background: var(--hover); color: var(--fg); }
#mdv-toc-panel .toc-item.active { border-left-color: var(--accent); color: var(--accent); }
#mdv-toc-panel .toc-h2 { padding-left: 20px; }
#mdv-toc-panel .toc-h3 { padding-left: 32px; }
#mdv-toc-panel .toc-h4 { padding-left: 44px; }
#mdv-toc-panel .toc-h5 { padding-left: 56px; }
#mdv-toc-panel .toc-h6 { padding-left: 68px; }

/* resize handle */
.resize-handle {
  width: 4px;
  cursor: col-resize;
  background: var(--border);
  flex-shrink: 0;
  transition: background .15s;
}
.resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

/* content area */
#mdv-content-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* editor pane */
#mdv-editor-pane {
  flex: 1;
  overflow: hidden;
  display: flex;
  flex-direction: row;
}
#mdv-editor-gutter {
  flex-shrink: 0;
  width: 4ch;
  overflow: hidden;
  box-sizing: border-box;
  padding: 16px 8px 16px 0;
  background: var(--panel);
  border-right: 1px solid var(--border);
  color: var(--fg2);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  text-align: right;
  white-space: pre;
  user-select: none;
}
#mdv-editor-textarea {
  flex: 1;
  width: 100%;
  background: var(--bg);
  color: var(--fg);
  border: none;
  outline: none;
  resize: none;
  padding: 16px 20px;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
  tab-size: 4;
  white-space: pre;
  overflow: auto;
}

/* preview pane */
#mdv-preview-pane {
  flex: 1;
  position: relative;
  overflow-y: auto;
  padding: 20px 28px;
  scroll-padding-top: 12px;
}
#mdv-preview-pane::after {
  content: '';
  display: block;
  height: max(45vh, 220px);
}

/* ── Markdown prose styles ───────────────── */
#mdv-preview-pane {
  line-height: 1.7;
  font-family: var(--font-sans);
}
#mdv-preview-pane h1,#mdv-preview-pane h2,#mdv-preview-pane h3,
#mdv-preview-pane h4,#mdv-preview-pane h5,#mdv-preview-pane h6 {
  margin: 1.2em 0 .4em;
  font-weight: 600;
  line-height: 1.3;
  color: var(--fg);
}
#mdv-preview-pane h1 { font-size: 1.7em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
#mdv-preview-pane h2 { font-size: 1.35em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
#mdv-preview-pane h3 { font-size: 1.15em; }
#mdv-preview-pane p  { margin: .7em 0; }
#mdv-preview-pane a  { color: var(--accent); }
#mdv-preview-pane a:hover { text-decoration: underline; }
#mdv-preview-pane code {
  font-family: var(--font-mono);
  font-size: .88em;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: .1em .4em;
}
#mdv-preview-pane pre {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: .8em 0;
}
#mdv-preview-pane pre code {
  background: transparent;
  border: none;
  padding: 0;
  font-size: .9em;
}
#mdv-preview-pane blockquote {
  border-left: 4px solid var(--accent);
  margin: .8em 0;
  padding: .3em 0 .3em 1em;
  color: var(--fg2);
}
#mdv-preview-pane ul, #mdv-preview-pane ol { padding-left: 1.8em; margin: .5em 0; }
#mdv-preview-pane li { margin: .2em 0; }
#mdv-preview-pane table { border-collapse: collapse; margin: .8em 0; width: 100%; }
#mdv-preview-pane th, #mdv-preview-pane td {
  border: 1px solid var(--border);
  padding: 6px 12px;
  text-align: left;
}
#mdv-preview-pane th { background: var(--panel); font-weight: 600; }
#mdv-preview-pane tr:hover { background: var(--hover); }
#mdv-preview-pane img { max-width: 100%; border-radius: 4px; }
#mdv-preview-pane hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
#mdv-preview-pane input[type=checkbox] { margin-right: .4em; }

/* front-matter box */
.frontmatter-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 14px;
  margin-bottom: 1em;
  font-size: .85em;
  font-family: var(--font-mono);
  color: var(--fg2);
  white-space: pre;
  overflow-x: auto;
}

/* mermaid wrapper */
.mermaid-wrap { text-align: center; margin: .8em 0; }
.mermaid-wrap svg { max-width: 100%; }

/* scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--fg2); }

/* mode: preview only / edit only / split */
body.mode-preview #mdv-editor-pane { display: none; }
body.mode-edit    #mdv-preview-pane { display: none; }
body.mode-edit    #mdv-toc-panel,
body.mode-split   #mdv-toc-panel   { display: none !important; }

/* split resize handle between editor and preview */
#mdv-split-handle { display: none; }
body.mode-split #mdv-split-handle {
  display: block;
  width: 4px;
  cursor: col-resize;
  background: var(--border);
  flex-shrink: 0;
}
body.mode-split #mdv-split-handle:hover { background: var(--accent); }

/* operation surface used by print/save/share; the application toolbar is excluded */
#mdv-operation-surface { display: none; }
@media print {
  html, body { height: auto; overflow: visible; background: #fff; }
  #mdv-root { display: none !important; }
  #mdv-operation-surface {
    display: flex !important;
    width: 100%;
    min-height: 0;
    color: #000;
    background: #fff;
  }
  #mdv-operation-surface .operation-toc {
    width: 190px;
    flex: 0 0 190px;
    padding: 0 16px 0 0;
    border-right: 1px solid #bbb;
  }
  #mdv-operation-surface .operation-content { flex: 1; min-width: 0; padding: 0 18px; }
  #mdv-operation-surface .operation-pane { flex: 1; min-width: 0; padding: 0 14px; }
  #mdv-operation-surface .operation-pane + .operation-pane { border-left: 1px solid #bbb; }
  #mdv-operation-surface .operation-editor {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font: 10pt/1.55 var(--font-mono);
  }
  #mdv-operation-surface .operation-preview { font: 10pt/1.6 var(--font-sans); }
  #mdv-operation-surface pre, #mdv-operation-surface table, #mdv-operation-surface img,
  #mdv-operation-surface blockquote { break-inside: avoid; }
  #mdv-operation-surface img { max-width: 100%; }

  /* 미리보기 프로즈 스타일은 #mdv-preview-pane 스코프라 복제본에는 적용되지 않으므로
     인쇄/PDF용 흑백 프로즈 스타일을 여기서 별도로 정의한다. */
  #mdv-operation-surface { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  #mdv-operation-surface .operation-preview { line-height: 1.6; }
  #mdv-operation-surface .operation-preview h1, #mdv-operation-surface .operation-preview h2,
  #mdv-operation-surface .operation-preview h3, #mdv-operation-surface .operation-preview h4,
  #mdv-operation-surface .operation-preview h5, #mdv-operation-surface .operation-preview h6 {
    margin: 1.2em 0 .4em;
    font-weight: 600;
    line-height: 1.3;
    color: #000;
  }
  #mdv-operation-surface .operation-preview h1 { font-size: 1.6em; border-bottom: 1px solid #bbb; padding-bottom: .3em; }
  #mdv-operation-surface .operation-preview h2 { font-size: 1.3em; border-bottom: 1px solid #bbb; padding-bottom: .2em; }
  #mdv-operation-surface .operation-preview h3 { font-size: 1.15em; }
  #mdv-operation-surface .operation-preview p  { margin: .7em 0; }
  #mdv-operation-surface .operation-preview a  { color: #0550ae; text-decoration: none; }
  #mdv-operation-surface .operation-preview code {
    font-family: var(--font-mono);
    font-size: .88em;
    background: #f2f2f2;
    border: 1px solid #ddd;
    border-radius: 3px;
    padding: .1em .4em;
  }
  #mdv-operation-surface .operation-preview pre {
    background: #f6f8fa;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 12px 14px;
    margin: .8em 0;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  #mdv-operation-surface .operation-preview pre code { background: transparent; border: none; padding: 0; font-size: .9em; }
  #mdv-operation-surface .operation-preview blockquote {
    border-left: 4px solid #999;
    margin: .8em 0;
    padding: .3em 0 .3em 1em;
    color: #555;
  }
  #mdv-operation-surface .operation-preview ul, #mdv-operation-surface .operation-preview ol { padding-left: 1.8em; margin: .5em 0; }
  #mdv-operation-surface .operation-preview li { margin: .2em 0; }
  #mdv-operation-surface .operation-preview table { border-collapse: collapse; margin: .8em 0; width: 100%; }
  #mdv-operation-surface .operation-preview th, #mdv-operation-surface .operation-preview td {
    border: 1px solid #999;
    padding: 6px 12px;
    text-align: left;
  }
  #mdv-operation-surface .operation-preview th { background: #f0f0f0; font-weight: 600; }
  #mdv-operation-surface .operation-preview hr { border: none; border-top: 1px solid #bbb; margin: 1.5em 0; }
  #mdv-operation-surface .operation-preview .frontmatter-box {
    background: #f6f8fa;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 1em;
    font-size: .85em;
    font-family: var(--font-mono);
    color: #555;
    white-space: pre-wrap;
  }
  #mdv-operation-surface .operation-toc .toc-item {
    display: block;
    padding: 2px 0;
    color: #555;
    text-decoration: none;
    font-size: 9pt;
    border-left: none;
  }
  #mdv-operation-surface .operation-toc .toc-h2 { padding-left: 10px; }
  #mdv-operation-surface .operation-toc .toc-h3 { padding-left: 20px; }
  #mdv-operation-surface .operation-toc .toc-h4 { padding-left: 30px; }
  #mdv-operation-surface .operation-toc .toc-h5 { padding-left: 40px; }
  #mdv-operation-surface .operation-toc .toc-h6 { padding-left: 50px; }
}
</style>
</head>
<body class="theme-pending mode-preview">

<div id="mdv-root">
  <!-- toolbar -->
  <div id="mdv-toolbar">
    <button class="tb" id="btnEdit"    title="편집 모드">Edit</button>
    <button class="tb" id="btnSplit"   title="분할 모드">Split</button>
    <button class="tb active" id="btnPreview" title="미리보기 모드">Preview</button>
    <div class="tb-sep"></div>
    <button class="tb" id="btnFind" title="검색">Search</button>
    <div class="tb-sep"></div>
    <button class="tb" id="btnToc"     title="목차 토글">≡</button>
    <div style="flex:1"></div>
    <div class="tb-dropdown">
      <button class="tb" id="btnExport" title="내보내기">Export ▾</button>
      <div id="exportMenu">
        <button id="btnExportHtml">HTML로 저장</button>
        <button id="btnExportPdf">PDF로 저장</button>
      </div>
    </div>
  </div>
  <div id="findBar">
    <input id="findInput" type="text" autocomplete="off" spellcheck="false" aria-label="검색">
    <span id="findCount">0 / 0</span>
    <button class="tb" id="findPrev" title="이전">↑</button>
    <button class="tb" id="findNext" title="다음">↓</button>
    <button class="tb" id="findClose" title="닫기">×</button>
  </div>
  <!-- main -->
  <div id="mdv-main">
    <!-- TOC -->
    <div id="mdv-toc-panel"></div>
    <div class="resize-handle" id="mdv-toc-handle"></div>

    <!-- content -->
    <div id="mdv-content-area">
      <div id="mdv-editor-pane">
        <div id="mdv-editor-gutter" aria-hidden="true"></div>
        <textarea id="mdv-editor-textarea" spellcheck="false" wrap="off"></textarea>
      </div>
      <div class="resize-handle" id="mdv-split-handle"></div>
      <div id="mdv-preview-pane"></div>
    </div>
  </div>
</div>
<div id="mdv-operation-surface" aria-hidden="true"></div>

<script src="marked.min.js"></script>
<script src="purify.min.js"></script>
<script src="markdown-app.js"></script>
</body>
</html>
