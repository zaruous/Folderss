name: PR Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\Folderss.sln

      - name: Publish
        run: dotnet publish .\Folderss\Folderss.csproj -c Release -o artifacts/Folderss-test --nologo

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: Folderss-test-${{ github.event.pull_request.number || github.run_number }}-${{ github.sha }}
          path: artifacts/Folderss-test
          retention-days: 7
