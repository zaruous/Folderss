name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '생성할 태그 이름 (예: v1.5.4)'
        required: true

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version from tag
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG".TrimStart('v')
          $parts = $tag.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $ver = $parts -join '.'
          $file = "Folderss/Properties/AssemblyInfo.cs"
          (Get-Content $file) `
            -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$ver`")" `
            -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$ver`")" |
            Set-Content $file

      - name: Restore
        run: dotnet restore .\Folderss.sln

      - name: Publish Release
        shell: pwsh
        run: |
          $packageDir = "artifacts/Folderss-$env:RELEASE_TAG"
          if (Test-Path $packageDir) {
            Remove-Item $packageDir -Recurse -Force
          }
          dotnet publish .\Folderss\Folderss.csproj -c Release -o $packageDir --nologo

      - name: Create ZIP
        shell: pwsh
        run: |
          $packageDir = "artifacts/Folderss-$env:RELEASE_TAG"
          $zipPath = "Folderss-$env:RELEASE_TAG.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
          files: Folderss-${{ env.RELEASE_TAG }}.zip
          generate_release_notes: true
