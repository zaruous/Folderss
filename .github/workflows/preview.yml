name: Preview Build

# PR마다 Windows에서 빌드한 실행 파일을 Actions 아티팩트로 올린다(릴리스는 만들지 않음).
# 정식 배포는 release.yml(태그 푸시)이 맡는다.
on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 이전 빌드는 취소한다.
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set preview version and name
        shell: pwsh
        env:
          # 브랜치 이름은 스크립트에 직접 넣지 않고 환경 변수로 받는다(스크립트 주입 방지).
          REF_NAME: ${{ github.ref_name }}
        run: |
          # AssemblyVersion의 앞 세 자리는 그대로 두고 마지막 자리에 실행 번호를 넣는다 (예: 1.7.0.42).
          # 다음 정식 태그(v1.7.1 등)가 항상 더 크므로 앱의 업데이트 확인과 충돌하지 않는다.
          $file = "Folderss/Properties/AssemblyInfo.cs"
          $content = Get-Content $file -Raw
          if ($content -notmatch 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)') { throw "AssemblyVersion을 찾지 못했습니다: $file" }
          $ver = "$($Matches[1]).$($Matches[2]).$($Matches[3]).${{ github.run_number }}"
          $content = $content `
            -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$ver`")" `
            -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$ver`")"
          Set-Content $file $content -NoNewline

          $sha = "${{ github.event.pull_request.head.sha || github.sha }}".Substring(0, 7)
          if ("${{ github.event_name }}" -eq "pull_request") {
            $label = "pr${{ github.event.pull_request.number }}"
          } else {
            $label = $env:REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          }
          $name = "Folderss-preview-$label-$sha"
          "PREVIEW_NAME=$name" >> $env:GITHUB_ENV
          "PREVIEW_VERSION=$ver" >> $env:GITHUB_ENV
          "PREVIEW_SHA=$sha" >> $env:GITHUB_ENV

      - name: Restore
        run: dotnet restore .\Folderss.sln

      - name: Publish
        shell: pwsh
        env:
          SOURCE_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}/tree/{2}', github.server_url, github.repository, github.ref_name) }}
        run: |
          dotnet publish .\Folderss\Folderss.csproj -c Release -o "artifacts/$env:PREVIEW_NAME" --nologo

          # 받은 사람이 어떤 커밋의 빌드인지 알 수 있게 정보 파일을 넣는다.
          @(
            "Folderss preview build (정식 릴리스 아님)"
            "version : $env:PREVIEW_VERSION"
            "commit  : ${{ github.event.pull_request.head.sha || github.sha }}"
            "source  : $env:SOURCE_URL"
            "run     : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            "built   : $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss')) UTC"
          ) | Set-Content "artifacts/$env:PREVIEW_NAME/PREVIEW.txt" -Encoding utf8

      - name: Upload preview
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PREVIEW_NAME }}
          path: artifacts/${{ env.PREVIEW_NAME }}
          retention-days: 14
          if-no-files-found: error

      - name: Summary
        shell: pwsh
        run: |
          @(
            "### 프리뷰 빌드"
            ""
            "| 항목 | 값 |"
            "|---|---|"
            "| 파일 | [$env:PREVIEW_NAME.zip](${{ steps.upload.outputs.artifact-url }}) |"
            "| 버전 | ``$env:PREVIEW_VERSION`` |"
            "| 커밋 | ``$env:PREVIEW_SHA`` |"
            "| 보관 | 14일 |"
            ""
            "압축을 풀고 ``Folderss.exe``를 실행합니다. 정식 릴리스가 아니므로 설치된 버전과 다른 폴더에서 실행하세요."
          ) | Add-Content $env:GITHUB_STEP_SUMMARY

  # 테스트는 빌드와 분리한다 — 실패해도 프리뷰 파일은 받을 수 있게.
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/Folderss.SearchTests -c Release --nologo --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 7
